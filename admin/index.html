<!doctype html>
<html lang="tr" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Werrise — Kontrol Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!-- Login -->
<div class="login" id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <a href="https://wealwaysrise.com" class="brand" style="margin-bottom:32px">
      <span class="brand-mark">W</span><span class="brand-divider"></span>
      <span class="brand-name"><b>WERRISE</b><span>DIGITAL LTD</span></span>
    </a>
    <div class="eyebrow">Kontrol Merkezi / Giriş</div>
    <h1 style="font-size:34px;margin-bottom:24px">Tekrar hoş geldin<span class="dot">.</span></h1>
    <div class="field"><label for="pw">Şifre</label><input class="input" id="pw" type="password" autofocus required></div>
    <p class="login-error" id="loginError">Şifre hatalı. Tekrar dene.</p>
    <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Giriş yap <span class="arrow">→</span></button>
    <p class="footnote">Özel alan · Werrise Digital Ltd</p>
  </form>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <a href="https://wealwaysrise.com" class="brand">
        <span class="brand-mark">W</span><span class="brand-divider"></span>
        <span class="brand-name"><b>WERRISE</b><span>KONTROL MERKEZİ</span></span>
      </a>
      <button class="icon-btn collapse-btn" id="collapseBtn" aria-label="Menüyü daralt">‹</button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <div class="avatar">O</div>
      <div class="who"><strong>Oğuz</strong><small>Werrise · Kurucu</small></div>
      <button class="icon-btn lock-btn" id="logoutBtn" aria-label="Kilitle" title="Kilitle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="sticky-head">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="tb-title"><h2 id="tbTitle">Dashboard</h2><small id="tbSub">Genel bakış</small></div>
      <div class="topbar-actions">
        <span class="clock"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b id="clock">--:--</b></span>
        <span class="week mono" id="isoWeek">----</span>
        <button class="icon-btn boxed" id="themeBtn" aria-label="Tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
        <a class="icon-btn boxed" href="#ayarlar" aria-label="Ayarlar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a>
        <a class="icon-btn boxed bell" href="#bugun" aria-label="Bildirimler"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span class="badge" id="bellCount">0</span></a>
      </div>
    </header>

    <!-- ŞİMDİ bar -->
    <div class="nowbar" id="nowbar"></div>
    </div>

    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="admin.js"></script>
<script src="private.js"></script>
<script>
// --- Login gate (PBKDF2-SHA256). Şifreyi değiştirmek için SALT + HASH yeniden üretilir. ---
const SALT='1b80a16a91c9dc3b10cd3bf06c7890c1', HASH='6d29826476d01e46fffd381ea538c243d9ed7816c248916680b409bb319d3af4', ITER=250000;
const KEY='wr-admin-auth';
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(SALT),iterations:ITER,hash:'SHA-256'},k,256))}
const unlock=()=>document.documentElement.classList.remove('locked');
// Özel notlar: şifreden ayrı bir AES anahtarı türetilir; oturum boyunca sessionStorage'da tutulur.
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function privKey(pw){const P=window.WR_PRIV;const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function openPrivate(key,fromSession){try{const P=window.WR_PRIV;if(!P||!key)return;const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));window.WR_setPrivate&&window.WR_setPrivate(JSON.parse(new TextDecoder().decode(pt)))}catch(e){console.warn('Özel notlar açılamadı');if(fromSession){try{sessionStorage.removeItem(KEY);sessionStorage.removeItem('wr-admin-pk')}catch(_){}const er=document.getElementById('loginError');er.textContent='Panel güncellendi — özel notları açmak için tekrar giriş yap.';er.classList.add('show');document.documentElement.classList.add('locked')}}}
try{if(sessionStorage.getItem(KEY)===HASH){unlock();const raw=sessionStorage.getItem('wr-admin-pk');if(raw)crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']).then(k=>openPrivate(k,true))}}catch(e){}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;
  const ok=await derive(document.getElementById('pw').value)===HASH;btn.disabled=false;
  const er=document.getElementById('loginError');er.textContent='Şifre hatalı. Tekrar dene.';er.classList.toggle('show',!ok);
  if(ok){const pw=document.getElementById('pw').value;try{sessionStorage.setItem(KEY,HASH)}catch(e){}unlock();document.getElementById('pw').value='';
    if(window.WR_PRIV){const k=await privKey(pw);try{sessionStorage.setItem('wr-admin-pk',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))))}catch(e){}openPrivate(k)}}
});
document.getElementById('logoutBtn').onclick=()=>{try{sessionStorage.removeItem(KEY);sessionStorage.removeItem('wr-admin-pk')}catch(e){}if(window.WR_setPrivate)window.WR_setPrivate({notes:[],deals:[{id:9,value:0,note:''}]});document.documentElement.classList.add('locked')};
</script>
</body>
</html>
